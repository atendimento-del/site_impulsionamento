<style>
:root{--or:#F04B13;--dk:#141210;--cr:#FAF3EE;--mu:#7A6E66}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"DM Sans",Helvetica,Arial,sans-serif;background:var(--cr);color:var(--dk);-webkit-font-smoothing:antialiased}
main{min-height:100svh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(28px,env(safe-area-inset-top)) 28px max(28px,env(safe-area-inset-bottom))}
.logo{display:inline-flex;flex-direction:column;align-items:flex-end;align-self:flex-start;line-height:.85}
.logo .a{font-family:"Abril Fatface",Georgia,serif;font-size:28px}
.logo .f{font-family:"Jost",sans-serif;font-weight:600;font-size:9px;letter-spacing:.55em;margin-right:-.55em;margin-top:3px;color:var(--or)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.tag{font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--or)}
h1{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:clamp(40px,11vw,56px);line-height:1.02;margin:14px 0 18px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--or)}
p.lead{font-size:18px;line-height:1.5;color:var(--mu);max-width:30ch}
.when{display:flex;align-items:center;gap:10px;margin-top:28px;font-weight:700;font-size:16px}
.when svg{flex:none;color:var(--or)}
.bottom{display:flex;flex-direction:column;gap:12px}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  background:var(--dk);color:#fff;text-decoration:none;font-weight:700;font-size:18px;
  padding:20px 24px;border-radius:16px;transition:transform .12s ease}
.cta:active{transform:scale(.98)}
.cta svg{width:24px;height:24px;flex:none}
.note{text-align:center;font-size:14px;color:var(--mu)}
</style>
</head>
<body>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2253297481919750&ev=PageView&noscript=1" alt=""></noscript>
<main>
  <span class="logo" aria-label="AgentFlow"><span class="a">Agent</span><span class="f">FLOW</span></span>

  <div class="mid">
    <div class="tag">Live gratuita</div>
    <h1>Monte seu primeiro fluxo com IA <em>ao vivo.</em></h1>
    <p class="lead">Pare de fazer tudo na mão. Em uma hora, do processo bagunçado à automação funcionando.</p>
    <div class="when">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span data-when>Data divulgada no grupo</span>
    </div>
  </div>

  <div class="bottom">
    <a class="cta js-link" href="#" rel="noopener">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#25D366" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3z"/><path fill="#fff" d="M22.6 18.9c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.6-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1.1-2.6c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8 0 1.6 1.2 3.2 1.4 3.4.2.2 2.4 3.6 5.7 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 2-.8 2.2-1.6.3-.8.3-1.5.2-1.6 0-.1-.2-.2-.5-.3z"/></svg>
      Entrar no grupo da live
    </a>
    <p class="note">Grátis. O link da live chega pelo grupo.</p>
  </div>
</main>
<script>
(function(){
  var c=window.LIVE||{};
  document.querySelectorAll('.js-link').forEach(function(a){
    a.href=c.linkGrupo||'#';
    a.addEventListener('click',function(ev){
      if(typeof window.fbq==='function' && a.href.indexOf('http')===0){
        ev.preventDefault();
        window.fbq('track','Lead',{content_name:'Grupo WhatsApp - Live'});
        setTimeout(function(){ window.location.href=a.href; },350);
      }
    });
  });
  if(c.dataHora){document.querySelectorAll('[data-when]').forEach(function(e){e.textContent=c.dataHora;});}
})();
</script>
</body>
</html>
